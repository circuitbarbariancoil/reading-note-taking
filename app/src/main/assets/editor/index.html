<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <style>
      html, body { margin: 0; padding: 0; background: #F4EFE3; color: #211E1A; }
      body { font-family: "Noto Sans CJK JP", sans-serif; }
      .wrap { padding: 16px; }
      .label { font-size: 12px; color: #6B655C; letter-spacing: 1px; margin: 18px 2px 8px; }
      .label:first-child { margin-top: 4px; }
      .box {
        background: #F4EFE3; border: 1px solid #DAD2C0; border-radius: 12px;
        padding: 12px 14px; min-height: 44px;
      }
      .box:focus-within { border-color: #3C5468; box-shadow: 0 0 0 3px #3C546820; }
      .cm-editor { background: transparent; }
      .wrap { padding-bottom: 64px; }
      #toolbar {
        position: fixed; left: 0; right: 0; bottom: 0;
        display: flex; gap: 8px; align-items: center;
        overflow-x: auto; -webkit-overflow-scrolling: touch;
        padding: 8px 12px; background: #EDE6D6; border-top: 1px solid #DAD2C0;
      }
      .tb-chip {
        flex: 0 0 auto; font-family: inherit; font-size: 13px;
        padding: 6px 12px; border-radius: 14px;
        border: 1px solid #DAD2C0; background: #F4EFE3; color: #211E1A;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="label">摘抄</div>
      <div class="box"><div id="excerpt"></div></div>
      <div class="label">批注</div>
      <div class="box"><div id="annotation"></div></div>
    </div>
    <div id="toolbar"></div>
    <script src="editor.bundle.js"></script>
  </body>
</html>
